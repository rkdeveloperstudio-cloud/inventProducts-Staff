<!DOCTYPE html>
<html>
<head>
    <title>Inventory PWA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

    <link rel="manifest" href="manifest.json">

   <style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


html,
body{

    width:100%;
    min-height:100%;
    margin:0;

}


body{

    font-family:
    "Segoe UI",
    Arial,
    sans-serif;

    color:white;

    padding:20px;

    overflow-x:hidden;

    background:
    linear-gradient(
        -45deg,
        #4f46e5,
        #2563eb,
        #06b6d4,
        #7c3aed
    );

    background-size:
    400% 400%;

    animation:
    GradientMove 15s ease infinite;

}


@keyframes GradientMove{

0%{

background-position:0% 50%;

}

50%{

background-position:100% 50%;

}

100%{

background-position:0% 50%;

}

}


/* TITLE */

h3{


    text-align:center;


    color:white;


    font-size:30px;


    margin:15px 0 25px;


    text-shadow:

    0 5px 15px rgba(0,0,0,.3);


}



/* GLASS BOX */

.box{

    padding:24px;

    margin-bottom:22px;

    border-radius:28px;

    background:
    rgba(255,255,255,.12);

    border:
    1px solid rgba(255,255,255,.25);

    backdrop-filter:
    blur(24px);

    -webkit-backdrop-filter:
    blur(24px);

    box-shadow:

    0 15px 40px rgba(0,0,0,.25),

    inset 0 1px 1px rgba(255,255,255,.25);

}



/* LABEL */

h4{


    color:white;


    margin-bottom:12px;


    font-size:18px;


}



/* INPUT */

input{

    width:100%;

    padding:15px;

    border-radius:16px;

    border:

    1px solid rgba(255,255,255,.25);

    background:

    rgba(255,255,255,.15);

    color:white;

    outline:none;

    font-size:16px;

    backdrop-filter:blur(10px);

}


input::placeholder{

    color:

    rgba(255,255,255,.7);

}


input:focus{

    border-color:#00d4ff;

    box-shadow:

    0 0 15px rgba(0,212,255,.5);

}



/* BUTTON */

button{

    width:100%;

    padding:16px;

    margin-top:14px;

    border:none;

    border-radius:18px;

    cursor:pointer;

    color:white;

    font-size:17px;

    font-weight:600;

    background:

    linear-gradient(
        135deg,
        #00bfff,
        #6d5dfc
    );

    box-shadow:

    0 0 10px rgba(0,191,255,.35),
    0 10px 30px rgba(0,0,0,.25);

    transition:.25s;

}


button:hover{

    transform:
    translateY(-3px);

    box-shadow:

    0 0 22px rgba(0,191,255,.7),

    0 15px 35px rgba(0,0,0,.35);

}


button:active{

    transform:scale(.97);

}


/* SEARCH RESULTS */

#results div{

    background:

    rgba(255,255,255,.12);

    backdrop-filter:

    blur(18px);

    border:

    1px solid rgba(255,255,255,.25);

    border-radius:20px;

    padding:18px;

    margin-bottom:15px;

    color:white;

    box-shadow:

    0 15px 30px rgba(0,0,0,.2);

}



/* SCANNER WINDOW */


#scannerContainer{


    position:fixed;



    top:50%;


    left:50%;



    transform:

    translate(-50%,-50%);



    width:90%;


    max-width:420px;



    height:220px;



    background:black;



    border-radius:25px;



    overflow:hidden;



    display:none;



    z-index:9999;



    box-shadow:


    0 25px 50px rgba(0,0,0,.5);



}



#scannerVideo{


    width:100%;


    height:100%;


    object-fit:cover;


}



.scan-line{


    position:absolute;



    width:100%;


    height:3px;



    background:#00ffcc;



    animation:

    move 1.5s infinite;


}



@keyframes move{


0%{

    top:10%;

}


50%{

    top:90%;

}


100%{

    top:10%;

}


}



/* CLOSE BUTTON */

#closeBtn{


    position:absolute;


    top:10px;


    right:10px;



    width:auto;



    padding:8px 14px;



    background:white;



    color:red;



    z-index:10;



}



/* SMALL MOBILE */

@media(max-width:600px){


body{

    padding:12px;

}



h3{

    font-size:26px;

}



.box{

    padding:16px;

}



}


</style>
</head>

<body>

<h3>Product Search</h3>


<div class="box">
    <h4>Barcode Search</h4>
    <input
    id="barcodeBox"
    placeholder="Enter barcode"
    autocomplete="off"
    autocorrect="off"
    autocapitalize="off"
    spellcheck="false">
    <button onclick="searchByBarcode()">Search Barcode</button>
    <button onclick="openScanner()">Open Camera Scan</button>
</div>

<div class="box">
    <h4>Keyword Search</h4>
    <input
    id="keywordBox"
    placeholder="Enter keyword"
    autocomplete="off"
    spellcheck="false">
    <button onclick="searchByKeyword()">Search</button>
</div>

<div id="results"></div>

<!-- Scanner -->
<div id="scannerContainer">
    <button id="closeBtn" onclick="closeScanner()">X</button>
    <video id="scannerVideo" playsinline autoplay muted></video>
    <div class="scan-line"></div>
</div>

<script src="https://unpkg.com/@zxing/library@latest"></script>
<script src="app.js"></script>

<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js")
        .then(() => console.log("SW registered"))
        .catch(err => console.log("SW failed", err));
}
</script>
</body>
</html>
